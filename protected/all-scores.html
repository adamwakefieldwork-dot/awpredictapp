<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Scores</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/all-scores.css">
</head>
<body>

<header class="site-header">
    <div class="logo-box">Logo not drawn</div>

    <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">&#9776;</button>

    <nav id="main-nav" class="main-nav">
        <a href="/app/your-scores.html" class="nav-link">Your Scores</a>
        <a href="/app/all-scores.html" class="nav-link active-tab">All Scores</a>
        <a href="/app/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/app/user-settings.html" class="nav-link">User Settings</a>
        <a href="/app/league-settings.html" id="league-settings-link" class="nav-link">League Settings</a>
    </nav>

    <select id="league-dropdown" class="league-dropdown">
        <option>Loading leagues...</option>
    </select>
</header>

<div class="content">

    <!-- No gameweek nav anymore — every gameweek renders at once,
         grouped into sections by all-scores.js -->

    <div class="table-scroll-wrapper">
        <table class="all-scores-table" id="all-scores-table">
            <thead>
                <tr>
                    <th class="fixture-col-header">Fixture</th>
                    <!-- one <th> per user gets inserted here by JS -->
                </tr>
            </thead>
            <tbody id="all-scores-body">
                <tr>
                    <td class="loading-msg">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="/site-header.js"></script>
<script src="/all-scores.js"></script>

</body>
</html>
