<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Settings</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/league-settings.css">
</head>
<body>

<header class="site-header">
    <div class="logo-box">Logo not drawn</div>

    <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">&#9776;</button>

    <nav id="main-nav" class="main-nav">
        <a href="/app/your-scores.html" class="nav-link">Your Scores</a>
        <a href="/app/all-scores.html" class="nav-link">All Scores</a>
        <a href="/app/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/app/user-settings.html" class="nav-link">User Settings</a>
        <a href="/app/league-settings.html" id="league-settings-link" class="nav-link active-tab">League Settings</a>
    </nav>

    <select id="league-dropdown" class="league-dropdown">
        <option>Loading leagues...</option>
    </select>
</header>

<div class="content">

    <div class="settings-box">

        <!-- Filled in by JS once data arrives — starts as a loading
             message, same pattern as fixturesList on your-scores.html -->
        <div id="settings-form-wrapper">
            <p class="loading-msg">Loading league settings...</p>
        </div>

        <p id="save-message" class="save-message"></p>

        <button id="save-button" class="btn-save">Save Settings</button>

    </div>

</div>

<script src="/site-header.js"></script>
<script src="/league-settings.js"></script>

</body>
</html>
