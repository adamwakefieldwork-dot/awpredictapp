<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join or Create a League</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/join-league.css">
</head>
<body>

<div class="join-container">
    <div class="join-box">

        <div class="tab-switch">
            <button type="button" class="tab-btn active" data-tab="join">Join a League</button>
            <button type="button" class="tab-btn" data-tab="create">Create a League</button>
        </div>

        <!-- JOIN PANEL -->
        <div id="join-panel" class="tab-panel active">
            <h1>Join a League</h1>
            <p class="subtitle">Enter the join code your league organiser shared with you</p>

            <form id="join-form">
                <div class="form-group">
                    <label for="join-code">Join Code</label>
                    <input type="text" id="join-code" name="joinCode" placeholder="e.g. ABC123" required>
                </div>

                <p id="join-error-message" class="error-message"></p>

                <button type="submit" class="btn-join">Join League</button>
            </form>
        </div>

        <!-- CREATE PANEL -->
        <div id="create-panel" class="tab-panel">
            <h1>Create a League</h1>
            <p class="subtitle">Pick a competition and season, then give your league a name</p>

            <form id="create-form">
                <div class="form-group">
                    <label for="league-name">League Name</label>
                    <input type="text" id="league-name" name="leagueName" placeholder="e.g. Office Predictions" required>
                </div>

                <div class="form-group">
                    <label for="competition-select">Competition</label>
                    <select id="competition-select" name="competitionId" required>
                        <option value="" disabled selected>Loading competitions...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="season-select">Season</label>
                    <select id="season-select" name="seasonId" required disabled>
                        <option value="" disabled selected>Select a competition first</option>
                    </select>
                </div>

                <p id="create-error-message" class="error-message"></p>

                <button type="submit" class="btn-join">Create League</button>
            </form>
        </div>

        <p class="signout-link"><a href="#" id="signout-link">Sign out</a></p>
    </div>
</div>

<script src="/join-league.js"></script>

</body>
</html>
