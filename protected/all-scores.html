<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Scores</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/all-scores.css">

    <!-- AG Grid Community (free tier) — pinned columns are what solve
         the clipping problem: Gameweek/Fixture/Result stay fixed on the
         left while player columns scroll independently underneath them. -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/dist/ag-grid-community.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/styles/ag-theme-quartz.css">

    <!-- Styling for the new range label + toggle button. Kept here so this
         file works on its own; you can move these rules into
         all-scores.css if you prefer. -->
    <style>
        .all-scores-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .range-label {
            font-weight: 600;
            color: #323232;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="logo-box">Logo not drawn</div>

    <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">&#9776;</button>

    <nav id="main-nav" class="main-nav">
        <a href="/app/your-scores.html" class="nav-link">Your Scores</a>
        <a href="/app/all-scores.html" class="nav-link active-tab">All Scores</a>
        <a href="/app/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/app/user-settings.html" class="nav-link">User Settings</a>
        <a href="/app/league-settings.html" id="league-settings-link" class="nav-link">League Settings</a>
    </nav>

    <select id="league-dropdown" class="league-dropdown">
        <option>Loading leagues...</option>
    </select>
</header>

<div class="content">

    <!-- Range controls: label shows which gameweeks are visible, button
         switches between "last / this / next gameweek" and the full season.
         Both IDs are used by all-scores.js. -->
    <div class="all-scores-controls">
        <span id="range-label" class="range-label"></span>
        <button id="toggle-range" class="btn">Show full season</button>
    </div>

    <div id="all-scores-status" class="loading-msg">Loading...</div>

    <!-- AG Grid mounts into this div. Fixed height + the theme class are
         both required — AG Grid needs an explicit container height to
         know how much space it has for its own internal scrolling. -->
    <div id="all-scores-grid" class="ag-theme-quartz all-scores-grid"></div>

</div>

<script src="/site-header.js"></script>
<script src="/all-scores.js"></script>

</body>
</html>
