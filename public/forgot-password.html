<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
<div class="signin-container">
    <div class="signin-box">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>

        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <p id="message" style="display: none;"></p>

            <button type="submit" class="btn-signin">Send Reset Link</button>
        </form>

        <p class="signup-link"><a href="signin.html">Back to sign in</a></p>
    </div>
</div>

<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const messageEl = document.getElementById('message');

    try {
        const res = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        // Same message shown regardless of outcome — the server
        // deliberately never reveals whether the email was found.
        messageEl.textContent = data.message || 'If that email is registered, a reset link has been sent.';
        messageEl.style.color = 'green';
        messageEl.style.display = 'block';

    } catch (err) {
        messageEl.textContent = 'Network error — try again';
        messageEl.style.color = 'red';
        messageEl.style.display = 'block';
    }
});
</script>

</body>
</html>
