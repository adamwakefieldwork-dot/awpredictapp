<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
<div class="signin-container">
    <div class="signin-box">
        <h1>Reset Password</h1>
        <p class="subtitle">Choose a new password</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" placeholder="Enter new password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter new password" required>
            </div>

            <p id="error-message" style="color: red; display: none;"></p>

            <button type="submit" class="btn-signin">Reset Password</button>
        </form>
    </div>
</div>

<script>
// The token arrives as a URL query parameter — e.g.
// /reset-password.html?token=abc123... — same URLSearchParams pattern
// used for the earlier "signup success" message on the signin page.
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const errorEl = document.getElementById('error-message');

if (!token) {
    errorEl.textContent = 'Invalid or missing reset link';
    errorEl.style.display = 'block';
    document.getElementById('reset-form').style.display = 'none';
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();

        if (!res.ok) {
            errorEl.textContent = data.error || 'Something went wrong';
            errorEl.style.display = 'block';
            return;
        }

        // Success — send them to sign in with their new password,
        // same ?signup=success-style flag pattern used elsewhere.
        window.location.href = '/signin?reset=success';

    } catch (err) {
        errorEl.textContent = 'Network error — try again';
        errorEl.style.display = 'block';
    }
});
</script>

</body>
</html>
