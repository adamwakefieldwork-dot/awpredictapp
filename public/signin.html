<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
<div class="signin-container">
    <div class="signin-box">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to set and see your predictions</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- NEW — link to the forgot-password flow -->
            <p class="forgot-link"><a href="forgot-password.html">Forgot password?</a></p>

            <p id="success-message" style="color: green; display: none;"></p>
            <p id="error-message" style="color: red; display: none;"></p>

            <button type="submit" class="btn-signin">Sign In</button>
        </form>

        <p class="signup-link">Don't have an account? <a href="signup.html">Click Here</a></p>
    </div>
</div>

<script>
  // Checks for ?reset=success (from reset-password.html) OR
  // ?signup=success (from signup.html) and shows the right message.
  const params = new URLSearchParams(window.location.search);
  const successEl = document.getElementById('success-message');

  if (params.get('reset') === 'success') {
    successEl.textContent = 'Password reset — please log in';
    successEl.style.display = 'block';
    window.history.replaceState({}, '', '/signin');
  } else if (params.get('signup') === 'success') {
    successEl.textContent = 'Account created — please log in';
    successEl.style.display = 'block';
    window.history.replaceState({}, '', '/signin');
  }

  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-message');

    try {
      const res = await fetch('/api/signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || 'Something went wrong';
        errorEl.style.display = 'block';
        return;
      }

      window.location.href = '/app/your-scores.html';

    } catch (err) {
      errorEl.textContent = 'Network error — try again';
      errorEl.style.display = 'block';
    }
  });
</script>

</body>
</html>
