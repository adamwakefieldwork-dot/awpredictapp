<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Football Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signin.css">
</head>
<body>

<div class="signin-container">
    <div class="signin-box">
        <h1>Join the Club</h1>
        <p class="subtitle">Create your account</p>

        <!-- action="#" is a fallback only; our <script> below intercepts
             the submit and handles everything with fetch() instead. -->
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
            </div>

            <!-- Filled in by JS below if signup fails (duplicate username/email,
                 mismatched passwords, missing fields, etc). Hidden by default. -->
            <p id="error-message" style="color: red; display: none;"></p>

            <button type="submit" class="btn-signin">Sign Up</button>
        </form>

        <p class="signup-link">Already have an account? <a href="signin.html">Sign in</a></p>
    </div>
</div>

<script>
  // Runs entirely in the browser. Its job: validate what it can locally
  // (like password match), then hand the real work off to the server
  // via fetch(), since only the server can touch the database.

  document.querySelector('form').addEventListener('submit', async (e) => {
    // Prevent the default page-reload/navigation the form would otherwise do.
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorEl = document.getElementById('error-message');

    // Client-side check: this is just a convenience for the user
    // (instant feedback, no network round-trip needed). It is NOT a
    // security measure — the server never trusts anything the browser
    // says, which is why the server does its own validation too.
    if (password !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match';
      errorEl.style.display = 'block';
      return;
    }

    try {
      // Send the signup data to the server as JSON. The password is sent
      // as plain text here, but that's fine — HTTPS encrypts it in transit,
      // and the server hashes it with bcrypt before ever storing it.
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        // e.g. 409 "Username already taken" or 409 "Email already registered",
        // both set explicitly by server.js.
        errorEl.textContent = data.error || 'Something went wrong';
        errorEl.style.display = 'block';
        return;
      }

      // Signup succeeded and server.js already logged the new user in
      // (it sets req.session.userId during signup), so we can go straight
      // to the dashboard rather than back to the signin page.
      window.location.href = '/signin?signup=success';

    } catch (err) {
      errorEl.textContent = 'Network error — try again';
      errorEl.style.display = 'block';
    }
  });
</script>

</body>
</html>
